<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061631"/>
      <stop offset="0.33" stop-color="#0E45AE"/>
      <stop offset="0.7" stop-color="#0B9AD8"/>
      <stop offset="1" stop-color="#2BD9C8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.08" r="0.82">
      <stop offset="0" stop-color="#B8F1FF" stop-opacity="0.62"/>
      <stop offset="0.45" stop-color="#B8F1FF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#B8F1FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.5" stop-color="#03132B" stop-opacity="0"/>
      <stop offset="1" stop-color="#03132B" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="drop" x1="0.22" y1="0" x2="0.78" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.48" stop-color="#F4FEFF"/>
      <stop offset="1" stop-color="#B4E4F2"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.5" stop-color="#0B5CA8" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#0B5CA8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#073B73" stop-opacity="0.38"/>
    </linearGradient>
    <filter id="dropShadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#02102B" flood-opacity="0.42"/>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="gloss" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="tile"><rect width="1024" height="1024" rx="224"/></clipPath>
    <clipPath id="dropClip"><path d="M512 188 C512 188 704 432 704 642 C704 783 614 868 512 868 C410 868 320 783 320 642 C320 432 512 188 512 188 Z"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <rect width="1024" height="1024" fill="url(#vignette)"/>
    <ellipse cx="512" cy="842" rx="196" ry="32" fill="#02152F" opacity="0.34" filter="url(#soft)"/>
    <g filter="url(#dropShadow)">
      <path d="M512 188 C512 188 704 432 704 642 C704 783 614 868 512 868 C410 868 320 783 320 642 C320 432 512 188 512 188 Z" fill="url(#drop)"/>
    </g>
    <g clip-path="url(#dropClip)">
      <rect x="300" y="160" width="430" height="730" fill="url(#inner)"/>
      <!-- A broad soft sheen down the left, a crisp specular near the shoulder. -->
      <ellipse cx="430" cy="470" rx="72" ry="172" transform="rotate(-24 430 470)" fill="#FFFFFF" opacity="0.72" filter="url(#soft)"/>
      <ellipse cx="452" cy="392" rx="26" ry="82" transform="rotate(-26 452 392)" fill="#FFFFFF" opacity="0.95" filter="url(#gloss)"/>
      <circle cx="492" cy="330" r="15" fill="#FFFFFF" opacity="0.9" filter="url(#gloss)"/>
      <!-- A cool bounce along the lower-right edge. -->
      <path d="M512 188 C512 188 704 432 704 642 C704 783 614 868 512 868 C596 826 654 738 654 638 C654 466 540 288 512 188 Z" fill="#72D7F2" opacity="0.18" filter="url(#soft)"/>
      <path d="M512 188 C512 188 704 432 704 642 C704 783 614 868 512 868 C410 868 320 783 320 642 C320 432 512 188 512 188 Z"
            fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="4"/>
    </g>
    <rect x="3" y="3" width="1018" height="1018" rx="221" fill="none" stroke="url(#edge)" stroke-width="6"/>
  </g>
</svg>
