[package]
name = "splash-server"
version = "1.10.0"
edition = "2021"
description = "Splash's serving process, in Rust: the HTTP APIs, the chat templates, the tokenizers and the engine's wire protocol client."
license = "Apache-2.0"

[lib]
name = "splash_server"
path = "src/lib.rs"

[dependencies]
chrono = "0.4.45"
llguidance = "1.9.1"
minijinja = { version = "3.1.0", features = ["builtins", "json", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth", "preserve_order"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
toktrie = "1.9.1"

[dev-dependencies]
